<body class="bg-background text-on-background min-h-screen pt-14 flex flex-col items-center pb-24">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-margin h-14 bg-surface dark:bg-on-background shadow-sm text-primary dark:text-inverse-primary text-headline-md font-headline-md">
<div class="flex items-center gap-xs">

<span class="text-headline-md font-headline-md font-bold text-primary dark:text-on-primary-fixed">CampusMind AI</span>
</div>
<div class="w-8 h-8 rounded-full overflow-hidden border border-outline-variant">
<img alt="User profile photo" class="w-full h-full object-cover" data-alt="A small, circular avatar portrait of a modern university student, styled in a clean, bright aesthetic suitable for a high-end web application profile picture. The lighting is soft and flattering, with a neutral background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDVxWBzxiKAFw-Hh1ir53wESNVrE_iL3zyLRFy9LaYWNHl_O0QeNvI2hgsPU9m58obLHeoPYiRo0gkmZ2HYXiY3dhGE3v8hSAP3XHCBFsKYPsRzYMgKd2HK4Hd-5Df7ecthohke4SYFcdAyZILFjobwYQIH2IB2ZlutU6XKZdGXpEzpbOUhr-2dqKy4eghuYJQG4iXrxwFmKI-uopcylfzCUYVQOolbjq1yF5gEgnu8urdXnWXmbFREGQ">
</div>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-[1280px] px-md md:px-[40px] flex-grow flex flex-col items-center justify-center py-lg">
<div class="w-full max-w-2xl bg-surface-container-lowest rounded-lg border border-outline-variant shadow-sm p-lg">
<div class="mb-xl text-center">
<h1 class="font-display-mobile text-display-mobile md:font-display-lg md:text-display-lg text-primary mb-xs">Profile Setup</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Complete your profile to personalize your academic experience.</p>
</div>
<form class="flex flex-col gap-lg">
<!-- Name Field -->
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="fullName">Full Name</label>
<input class="h-[44px] bg-surface-container-low border-transparent focus:border-primary focus:bg-surface-container-lowest focus:ring-0 rounded px-sm font-body-lg text-body-lg text-on-surface transition-colors" id="fullName" placeholder="Enter your full name" type="text">
</div>
<!-- Department Field (Pre-filled) -->
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="department">Department</label>
<select class="h-[44px] bg-surface-container-low border-transparent focus:border-primary focus:bg-surface-container-lowest focus:ring-0 rounded px-sm font-body-lg text-body-lg text-on-surface transition-colors appearance-none" id="department">
<option value="Computer Science &amp; Engineering">Computer Science &amp; Engineering</option>
<option value="Electrical &amp; Electronic Engineering">Electrical &amp; Electronic Engineering</option>
<option value="Natural Fiber Engineering">Natural Fiber Engineering</option>
<option value="Business Administration">Business Administration</option>
</select>
</div>
<!-- Semester Dropdown -->
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="semester">Current Semester</label>
<select class="h-[44px] bg-surface-container-low border-transparent focus:border-primary focus:bg-surface-container-lowest focus:ring-0 rounded px-sm font-body-lg text-body-lg text-on-surface transition-colors appearance-none" id="semester">
<option disabled="" selected="" value="">Select Semester</option>
<option value="1">1st Semester</option>
<option value="2">2nd Semester</option>
<option value="3">3rd Semester</option>
<option value="4">4th Semester</option>
<option value="5">5th Semester</option>
<option value="6">6th Semester</option>
<option value="7">7th Semester</option>
<option value="8">8th Semester</option>
</select>
</div>
<!-- CGPA (Optional) -->
<div class="flex flex-col gap-base">
<div class="flex justify-between items-end">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="cgpa">Current CGPA <span class="text-on-surface-variant font-normal normal-case">(Optional)</span></label>
<span class="font-body-sm text-body-sm text-outline">For 2nd semester and above</span>
</div>
<input class="h-[44px] bg-surface-container-low border-transparent focus:border-primary focus:bg-surface-container-lowest focus:ring-0 rounded px-sm font-body-lg text-body-lg text-on-surface transition-colors" id="cgpa" max="4.00" min="0" placeholder="e.g. 3.50" step="0.01" type="number">
</div>
<!-- Skills Tag Area (Simulated) -->
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="skills">Current Skills</label>
<div class="min-h-[88px] bg-surface-container-low border-transparent focus-within:border-primary focus-within:bg-surface-container-lowest rounded p-sm border transition-colors flex flex-wrap content-start gap-xs">
<!-- Example Chips -->
<span class="inline-flex items-center gap-base px-sm py-1 bg-surface-variant rounded-full font-body-sm text-body-sm text-on-surface">
                            Python <button class="material-symbols-outlined text-[16px] leading-none hover:text-error transition-colors" data-icon="close" type="button">close</button>
</span>
<span class="inline-flex items-center gap-base px-sm py-1 bg-surface-variant rounded-full font-body-sm text-body-sm text-on-surface">
                            Data Structures <button class="material-symbols-outlined text-[16px] leading-none hover:text-error transition-colors" data-icon="close" type="button">close</button>
</span>
<input class="flex-grow bg-transparent border-none p-0 focus:ring-0 font-body-lg text-body-lg text-on-surface min-w-[150px]" id="skills" placeholder="Add a skill and press Enter..." type="text">
</div>
</div>
<!-- Career Goal -->
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="goal">Primary Career Goal</label>
<textarea class="bg-surface-container-low border-transparent focus:border-primary focus:bg-surface-container-lowest focus:ring-0 rounded p-sm font-body-lg text-body-lg text-on-surface transition-colors resize-y" id="goal" placeholder="What are you aiming for after graduation? (e.g. Software Engineer at a top tech firm, AI Researcher...)" rows="3"></textarea>
</div>
<!-- Action Button -->
<div class="mt-md pt-lg border-t border-outline-variant flex justify-end">
<button class="bg-[#0A192F] hover:bg-opacity-90 text-on-primary h-[48px] px-xl rounded font-headline-md text-headline-md transition-all active:scale-95 shadow-[0px_8px_24px_rgba(10,25,47,0.12)]" type="button"><span class="flex items-center justify-center gap-xs"><span class="material-symbols-outlined animate-spin" style="font-size: 20px;">progress_activity</span>Save Profile</span></button>
</div>
</form>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-16 pb-safe bg-surface-container-lowest dark:bg-inverse-surface border-t border-outline-variant dark:border-outline md:hidden">
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim opacity-70 hover:bg-surface-container-low dark:hover:bg-surface-container-highest active:scale-90 transition-transform duration-200 w-full h-full" href="#">
<span class="material-symbols-outlined mb-1" data-icon="auto_stories">auto_stories</span>
<span class="text-label-caps font-label-caps">Study Hub</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim opacity-70 hover:bg-surface-container-low dark:hover:bg-surface-container-highest active:scale-90 transition-transform duration-200 w-full h-full" href="#">
<span class="material-symbols-outlined mb-1" data-icon="quiz">quiz</span>
<span class="text-label-caps font-label-caps">Exam Prep</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim opacity-70 hover:bg-surface-container-low dark:hover:bg-surface-container-highest active:scale-90 transition-transform duration-200 w-full h-full" href="#">
<span class="material-symbols-outlined mb-1" data-icon="psychology">psychology</span>
<span class="text-label-caps font-label-caps">Advisor</span>
</a>
<a class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed-dim relative after:content-[''] after:absolute after:top-0 after:w-8 after:h-0.5 after:bg-primary dark:after:bg-primary-fixed-dim hover:bg-surface-container-low dark:hover:bg-surface-container-highest active:scale-90 transition-transform duration-200 w-full h-full" href="#">
<span class="material-symbols-outlined mb-1 text-primary" data-icon="person" data-weight="fill" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="text-label-caps font-label-caps">Profile</span>
</a>
</nav>




</body></html>
